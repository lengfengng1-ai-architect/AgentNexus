[project]
name = "allygo-marketing-agent"
version = "0.1.0"
description = "AllyGo 营销方案 Agent 后端"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-openai>=1.3.3",
    "jinja2>=3.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=5.0",
    "ddgs>=1.2.0",
    "sse-starlette>=3.4.5",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.15",
    "pylint>=3.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["app"]

[tool.coverage.run]
source = ["app"]

[tool.mypy]
python_version = "3.14"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pylint.MASTER]
ignore_patterns = [".git", "__pycache__"]
jobs = 0
disable = ["C", "R", "I", "E0401", "E0611", "E1101", "W1203", "W0718", "W0212"]

[tool.uv]
default-groups = ["dev"]
package = false
