# OpenSpec: 工作流编排
# in_scope id: workflow-orchestration
# ──────────────────────────────────────────────
openapi: "3.1.0"
info:
  title: "工作流编排"
  description: "Agent 节点的可配置 LangGraph 编排底座，支持按 YAML 定义工作流并运行。"
  version: "v0.1"
  x-in-scope-ref: "workflow-orchestration"

servers:
  - url: "http://localhost:8000/api/v1"
    description: "本地开发"

paths:
  /workflows:
    get:
      operationId: "workflows_list"
      summary: "列出已注册工作流"
      description: |
        返回系统中所有已加载的 YAML 工作流定义列表，包含工作流 ID、名称和版本。
      responses:
        "200":
          description: "成功返回工作流列表"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /workflows/{workflow_id}:
    get:
      operationId: "workflows_get"
      summary: "获取工作流定义"
      description: |
        根据工作流 ID 返回完整工作流定义，包括节点列表和编排边。
      parameters:
        - name: "workflow_id"
          in: path
          required: true
          description: "工作流唯一标识"
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: "成功返回工作流定义"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinition"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /workflows/{workflow_id}/run:
    post:
      operationId: "workflows_run"
      summary: "运行工作流"
      description: |
        按指定工作流 ID 执行 LangGraph 编排流程。输入会写入工作流初始状态，
        每个节点按 YAML 中的边顺序执行，最终返回所有节点输出。
      parameters:
        - name: "workflow_id"
          in: path
          required: true
          description: "工作流唯一标识"
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRunRequest"
      responses:
        "200":
          description: "工作流执行完成"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    # ── 请求体 ──
    WorkflowRunRequest:
      type: object
      description: "工作流运行请求"
      required:
        - input
      properties:
        input:
          type: object
          description: "工作流初始输入，会写入 state.input"
          additionalProperties: true

    # ── 响应体 ──
    WorkflowListResponse:
      type: object
      description: "工作流列表响应"
      required:
        - items
      properties:
        items:
          type: array
          description: "工作流摘要列表"
          items:
            $ref: "#/components/schemas/WorkflowSummary"

    WorkflowSummary:
      type: object
      description: "工作流摘要"
      required:
        - id
        - name
        - version
      properties:
        id:
          type: string
          description: "工作流唯一标识"
        name:
          type: string
          description: "工作流中文名称"
        version:
          type: string
          description: "工作流版本号"

    WorkflowDefinition:
      type: object
      description: "工作流完整定义"
      required:
        - id
        - name
        - version
        - nodes
        - edges
      properties:
        id:
          type: string
          description: "工作流唯一标识"
        name:
          type: string
          description: "工作流中文名称"
        version:
          type: string
          description: "工作流版本号"
        nodes:
          type: array
          description: "工作流节点列表"
          items:
            $ref: "#/components/schemas/WorkflowNode"
        edges:
          type: array
          description: "工作流边列表"
          items:
            $ref: "#/components/schemas/WorkflowEdge"

    WorkflowNode:
      type: object
      description: "工作流节点定义"
      required:
        - id
        - agent
      properties:
        id:
          type: string
          description: "节点唯一标识"
        agent:
          type: string
          description: "节点使用的已注册 Agent 名称"
        depends_on:
          type: array
          description: "前置节点 ID 列表，用于推导执行顺序"
          items:
            type: string
        input_mapping:
          type: object
          description: "输入映射，JSONPath 风格"
          additionalProperties:
            type: string
        output_mapping:
          type: object
          description: "输出映射，JSONPath 风格"
          additionalProperties:
            type: string

    WorkflowEdge:
      type: object
      description: "工作流边定义"
      required:
        - from
        - to
      properties:
        from:
          type: string
          description: "起始节点 ID"
        to:
          type: string
          description: "目标节点 ID，__end__ 表示结束"

    WorkflowRunResponse:
      type: object
      description: "工作流运行响应"
      required:
        - workflow_id
        - status
        - outputs
      properties:
        workflow_id:
          type: string
          description: "工作流唯一标识"
        status:
          type: string
          description: "执行状态"
          enum:
            - completed   # 执行完成
            - failed      # 执行失败
        outputs:
          type: object
          description: "各节点输出字典，key 为节点 ID"
          additionalProperties: true

    # ── 共享错误模型 ──
    APIError:
      type: object
      description: "统一错误响应"
      properties:
        detail:
          type: string
          description: "人类可读的错误描述"
        code:
          type: string
          description: "错误码（如 'not_found', 'validation_error'）"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: "出错字段名"
              message:
                type: string
                description: "字段级错误说明"
      required:
        - detail
        - code

  responses:
    BadRequest:
      description: "请求参数错误"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    NotFound:
      description: "资源不存在"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ValidationError:
      description: "字段校验失败"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    InternalError:
      description: "服务器内部错误"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
