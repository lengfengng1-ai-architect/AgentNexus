# OpenSpec: 意图识别
# in_scope id: workflow-orchestration
# ──────────────────────────────────────────────
openapi: "3.1.0"
info:
  title: "意图识别"
  description: "识别用户输入意图并返回结构化结果，支持多轮对话上下文累积。"
  version: "v0.3"
  x-in-scope-ref: "workflow-orchestration"

servers:
  - url: "http://localhost:8000/api/v1"
    description: "本地开发"

paths:
  /chat/stream:
    post:
      operationId: "chat_stream"
      summary: "流式聊天，实时推送推理过程和意图识别结果"
      description: |
        接收用户消息和可选上下文，通过 intent_recognition agent 判断意图。
        SSE 流式输出：
        1. `event: reasoning` — 模型思考过程片段
        2. `event: intent` — 完整的意图识别 JSON（intent/reply/market_name/brand_input/missing_fields/image_url/video_prompt/generation_prompt）
        3. `event: done` — 流结束

        intent 支持：generate_plan、query_data、chat、clarify、update_context、generate_video、text_to_video、text_to_image、market_research。
        market_research 用于市场调研/竞品分析场景，复用 POST /market-analysis/stream 端点流式消费。
        generate_video 用于图生视频场景，从附件元数据获取 image_url。
        text_to_video 用于文生视频场景，generation_prompt 从用户输入提取描述。
        text_to_image 用于文生图场景，generation_prompt 从用户输入提取描述。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatStreamRequest"
      responses:
        "200":
          description: "SSE 流式响应"
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE 事件流"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    ChatStreamRequest:
      type: object
      description: "流式聊天请求"
      required:
        - message
      properties:
        message:
          type: string
          description: "用户输入消息"
          maxLength: 2000
        context:
          type: object
          description: "当前对话上下文，携带已积累的 brand_input（多轮对话）"
          additionalProperties: true

    # ── 共享错误模型 ──
    APIError:
      type: object
      description: "统一错误响应"
      properties:
        detail:
          type: string
          description: "人类可读的错误描述"
        code:
          type: string
          description: "错误码"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: "出错字段名"
              message:
                type: string
                description: "字段级错误说明"
      required:
        - detail
        - code

  responses:
    BadRequest:
      description: "请求参数错误"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ValidationError:
      description: "字段校验失败"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    InternalError:
      description: "服务器内部错误"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
