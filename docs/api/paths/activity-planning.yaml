# OpenSpec: 活动规划
# in_scope id: activity-planning
# 字段语义/枚举值待人工确认（AI 草拟，镜像 budget-analysis.yaml）
openapi: "3.1.0"
info:
  title: "活动规划"
  description: "基于运动类型/城市，结合 mock 赛事/场馆/活动热度数据，给出活动规划建议。SSE 流式推送，结果按 ID 持久化。"
  version: "v0.1"
  x-in-scope-ref: "activity-planning"
servers:
  - url: "http://localhost:8000/api/v1"
    description: "本地开发"
paths:
  /activity-planning/stream:
    post:
      operationId: "activity_planning_stream"
      summary: "SSE 流式活动规划"
      description: "接收运动类型/城市，SSE 流式推送活动规划进度和结果。result 事件携带 activity_planning_id。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityPlanningRequest"
      responses:
        "200":
          description: "SSE 流"
          content:
            text/event-stream:
              schema:
                type: string
        "500":
          description: "服务异常"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /activity-planning/results/{activity_id}:
    get:
      operationId: "activity_planning_result_get"
      summary: "按 ID 拉取活动规划结果"
      description: "供移动端活动详情页按 activity_planning_id 拉取。activity_id 格式：ap-<8位小写hex>。"
      parameters:
        - name: activity_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^ap-[0-9a-f]{8}$"
          description: "活动规划结果 ID"
      responses:
        "200":
          description: "活动规划结果"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPlanningResult"
        "404":
          description: "结果不存在或 ID 非法"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          description: "服务异常"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
components:
  schemas:
    ActivityPlanningRequest:
      type: object
      required: [sport_type, city]
      properties:
        sport_type:
          type: string
          description: "运动类型，如羽毛球/跑步/瑜伽"
        city:
          type: string
          description: "目标城市"
    CandidateTournament:
      type: object
      required: [name, sport_type, scale, frequency, exact_match]
      properties:
        name: { type: string }
        sport_type: { type: string }
        scale: { type: string }
        frequency: { type: string }
        sponsorship_options:
          type: array
          items: { type: string }
        exact_match: { type: boolean }
    ActivityPlanningResult:
      type: object
      required: [sport_type, city, candidates, suggestion]
      properties:
        sport_type: { type: string }
        city: { type: string }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/CandidateTournament" }
        events_summary:
          type: object
          nullable: true
          properties:
            monthly: { type: integer }
            avg_participants: { type: integer }
            categories: { type: array, items: { type: string } }
        venues_summary:
          type: object
          nullable: true
          properties:
            count: { type: integer }
            types: { type: array, items: { type: string } }
            capacity: { type: string }
        suggestion: { type: string }
    APIError:
      type: object
      properties:
        detail: { type: string }
        code: { type: string }
        errors: { type: object, nullable: true }
