# ──────────────────────────────────────────────
# OpenSpec: 文件上传
# in_scope id: chat-input 附件功能
# ──────────────────────────────────────────────
openapi: "3.1.0"
info:
  title: "文件上传"
  description: "聊天附件本地文件上传接口，支持单文件/多文件 multipart/form-data 上传"
  version: "v0.1"

servers:
  - url: "http://localhost:8000/api/v1"
    description: "本地开发"

paths:
  /upload:
    post:
      operationId: upload_files
      summary: "上传文件"
      description: |
        接受 multipart/form-data 文件上传，保存到服务器 uploads/ 目录并返回可访问的 URL。
        支持单文件或多文件同时上传。文件以 uuid 前缀重命名避免重名冲突。
        超过上传大小限制（默认 50MB）返回 422 错误。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: "上传的文件列表"
      responses:
        "200":
          description: "上传成功，返回文件 URL 列表"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: "请求中没有上传文件"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: "文件超过大小限制"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    UploadFileItem:
      type: object
      description: "单个上传文件信息"
      properties:
        name:
          type: string
          description: "原始文件名"
          example: "方案文档.docx"
        url:
          type: string
          format: uri
          description: "可访问的文件 URL"
          example: "/uploads/a1b2c3d4.docx"
        size:
          type: integer
          description: "文件大小（字节）"
          example: 1048576
        mimeType:
          type: string
          description: "文件的 MIME 类型"
          example: "image/png"
      required:
        - name
        - url
        - size
        - mimeType

    UploadResponse:
      type: object
      description: "上传接口响应"
      properties:
        files:
          type: array
          description: "上传成功的文件列表"
          items:
            $ref: "#/components/schemas/UploadFileItem"
      required:
        - files

    APIError:
      type: object
      description: "统一错误响应"
      properties:
        detail:
          type: string
          description: "人类可读的错误描述"
        code:
          type: string
          description: "错误码"
      required:
        - detail
        - code

  responses:
    InternalError:
      description: "服务器内部错误"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
