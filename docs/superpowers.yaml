# 营销方案 Agent — 能力边界定义
# AI 编码前必须读取此文件。
# in_scope: 允许实现
# out_scope: 禁止实现（AI 不得生成相关代码）
# data_boundaries: 数据使用约束
# llm_boundaries: LLM 生成约束
---
version: "v0.1"

platform:
  name: "AllyGo"
  description: "运动场景 × 品牌营销平台"

capabilities:
  in_scope:
    - id: "brand-input"
      name: "品牌需求录入"
      description: "接收品牌方填写的结构化需求（品类/城市/预算/周期）"
      constraints: "字段由 OpenSpec 定义，动态增减需改 spec"

    - id: "data-query"
      name: "AllyGo 数据查询"
      description: "按城市×运动类型查询平台数据（盟域/赛事/达人/经营社/活动）"
      constraints: "MVP 阶段用 mock 数据，预留真实 API 切换钩子"

    - id: "fitness-engine"
      name: "品牌×运动适配度评估"
      description: "计算品牌品类与运动场景的匹配度"
      constraints: "规则矩阵版本用配置文件管理，不改代码"

    - id: "plan-generation"
      name: "营销方案生成"
      description: "基于品牌需求和平台数据，LLM 生成 9 章营销方案"
      constraints: |
        数据引用必须来自 API/mock，LLM 不可编造厂商/赛事/达人名称。
        LLM 可以做创意策划（赛事名称、活动形式、主题概念）。

    - id: "market-analysis"
      name: "市场分析"
      description: "基于品牌名称和品类，进行行业趋势、趋势信号、消费者洞察和竞争格局四维市场分析"
      constraints: |
        网络搜索使用 Bing 搜索（已替换 DuckDuckGo）。
        SSE 流式推送分析进度。
        数据引用必须来自搜索或 mock，LLM 不可编造厂商/赛事/达人名称。
        MVP 阶段支持 mock 模式（USE_MOCK_DATA=true）。

    - id: "budget-analysis"
      name: "预算评估"
      description: "基于品类/预算/周期/城市，结合 mock 平台数据给出预算分配建议（达人/内容/活动/投放/运营）、KPI 预估、时间线和一句话建议，多轮澄清收集需求，结果在聊天入口卡 + 独立详情页展示"
      constraints: |
        SSE 流式推送评估进度，结果持久化到 mock_data/budget_analysis/results/（ba-<uuid8>.json），按 ID 拉取。
        allocations 数据（百分比/金额）必须来自 mock 预算模板（plan_budget_kpi.json），LLM 不可编造分配数值。
        KPI 预估按 mock base KPI × 预算比例缩放，不可编造数值。
        一句话建议由 LLM 基于已有 allocations/KPI 数据推理生成，不可编造厂商/赛事/达人名称。
        MVP 阶段 allocations 用固定模板百分比，不按品类/城市调权（预留升级）。
        仅输出规划建议，不自动花钱/下单/执行。

    - id: "audience-insight"
      name: "人群洞察"
      description: "基于产品名称，搜索并提取目标人群的原始数据（人口统计/购买行为/使用场景），综合生成用户画像"
      constraints: |
        同一产品同一次调研结果缓存到 mock_data/audience_insight/ 和 mock_data/user_persona/。
        每个字段标注 method（quoted/extracted/inferred）。
        不编造用户数据，不确定的字段留空。

    - id: "video-generation"
      name: "视频生成"
      description: "文生视频和图生视频，调用 HappyHorse 系列模型，SSE 流式推送进度和结果"
      constraints: |
        MVP 阶段通过单独的测试页访问（/video-test）。
        图生视频的图片输入通过 URL 方式提供（不涉及上传）。
        所有名称和数据必须来自 API/mock，LLM 不可编造。

    - id: "document-export"
      name: "方案文档导出"
      description: "Markdown → PDF/Word 导出"
      constraints: "主力格式保质量，备选格式基础可用即可"

    - id: "product-research"
      name: "产品调研"
      description: "基于产品名称，通过 Web 搜索获取并提取结构化产品信息（identity / official_description / features / specifications / availability 五大模块），每个字段标注 method 和 sources 实现可追溯"
      constraints: |
        数据必须来自搜索或 mock，LLM 不可编造产品名称或数据数值。
        支持 Hybrid 策略：批量搜索抓取 + ReAct 工具调用查漏补缺。
        同一产品调研结果缓存到 mock_data/product_info/。
        不编造不确定的字段，留空处理。

    - id: "web-search-tool"
      name: "Web 搜索工具"
      description: "将 searxng_search 封装为 LangChain Tool，供所有 Agent 调用以搜索 Web 获取页面列表"
      constraints: "输入 query + max_results，返回格式化文本（标题/URL/摘要）。跳过已拦截域名和非网页链接。"

    - id: "web-fetch-tool"
      name: "Web 抓取工具"
      description: "将 httpx 抓取 + HTML 提取封装为 LangChain Tool，供所有 Agent 调用以读取网页内容"
      constraints: "输入 URL，返回纯文本（最多 4000 字符）。非 HTML 内容或网络错误时返回提示文本，不抛异常。"

  out_scope:
    - id: "campaign-execution"
      name: "方案自动执行"
      reason: "v1 只做到方案输出，不自动创建活动/发送达人邀约"

    - id: "external-platform-data"
      name: "跨平台数据接入"
      reason: "不接入抖音/小红书等外部平台数据，合规风险高"

    - id: "kpi-attribution"
      name: "效果归因系统"
      reason: "需要完整 Campaign 跟踪系统，P2 能力"

    - id: "competitor-analysis"
      name: "竞品分析功能"
      reason: "竞品运动场景数据不在 AllyGo 体系内"

    - id: "non-sport-brands"
      name: "非运动类品牌支持"
      reason: "数据底盘仅覆盖运动场景，非运动品牌提示暂不支持"

    - id: "user-auth-system"
      name: "用户认证系统"
      reason: "身份认证使用 AllyGo 已有系统，本项目不做"

    - id: "payment-integration"
      name: "支付/订单功能"
      reason: "本项目不出方案交易功能"

data_boundaries:
  can_use:
    - "AllyGo 平台自有数据（活动/赛事/盟域/达人/经营社/人群画像聚合统计）"
    - "行业公开报告摘录（人工整理+LLM辅助，非实时 API）"
    - "品牌方自行填写的品牌信息"
  cannot_use:
    - "用户个人隐私数据（仅展示聚合统计，不暴露个人数据）"
    - "第三方付费数据（尼尔森/欧睿等）"
    - "未授权的外部平台数据"

llm_boundaries:
  can_generate:
    - "创意策划内容（赛事名称、活动形式、主题概念、时间线规划）"
    - "文案润色与叙事组织"
    - "基于数据的推理结论"
  cannot_generate:
    - "厂商/赛事/达人名称（必须来自 API/mock）"
    - "数据数值（人群规模、活动密度、成本参数）"
    - "LLM 自己的 prompt（禁止 Agent 自修改 prompt）"
