<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预算预览 - 交互原型</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff; --fg:#111111; --accent:#1677ff;
  --surface:#f7f8fa; --muted:#6b7280; --border:#d9dee7;
  --accent-soft:color-mix(in srgb,#1677ff 14%,#fff);
  --accent-softer:color-mix(in srgb,#1677ff 6%,#fff);
  --accent-border:color-mix(in srgb,#1677ff 32%,#fff);
  --fg-soft:color-mix(in srgb,#111 72%,#fff);
  --shadow-lg:color-mix(in srgb,#111 22%,transparent);
  --line:color-mix(in srgb,#d9dee7 55%,#fff);
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;
  --ff:Inter,'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
}
body{background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:var(--ff);padding:24px}
.phone{
  width:380px;height:780px;background:var(--bg);border-radius:44px;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 20px 60px var(--shadow-lg);
  position:relative;overflow:hidden;display:flex;flex-direction:column;
}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#111;border-radius:0 0 16px 16px;z-index:10}
.phone-inner{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:0}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:6px 24px 4px;font-size:11px;font-weight:700;letter-spacing:.3px;flex-shrink:0;height:28px;margin-top:24px}
.sb-r{display:flex;gap:3px;align-items:center}

/* ---- Dialog ---- */
.page-dialog{flex:1;display:flex;flex-direction:column}
.dialog-mask{position:absolute;inset:0;background:rgba(15,23,42,0.35);display:flex;align-items:center;justify-content:center;z-index:50}
.dialog-box{width:300px;background:var(--bg);border-radius:var(--r-lg);box-shadow:0 12px 40px var(--shadow-lg);overflow:hidden;padding:18px 16px 14px;animation:fadeIn .35s cubic-bezier(0.16,1,0.3,1) both}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px) scale(0.97)}}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.section{animation:slideUp .35s cubic-bezier(0.16,1,0.3,1) both}
.section:nth-child(2){animation-delay:.05s}
.section:nth-child(3){animation-delay:.1s}
.dialog-title{text-align:center;margin-bottom:14px}
.dialog-title .title{font-size:15px;font-weight:700;color:var(--fg)}
.dialog-title .sub{font-size:11px;color:var(--muted);line-height:1.4;margin-top:2px}
.cards{display:flex;gap:8px;margin-bottom:14px}
.card{flex:1;padding:12px 10px;text-align:center;border-radius:var(--r-md)}
.card-primary{background:var(--accent-softer);border:1px solid var(--accent-border)}
.card-secondary{background:var(--surface);border:1px solid var(--border)}
.card .label{font-size:10px;color:var(--muted);font-weight:500;margin-bottom:3px}
.card .value{font-size:18px;font-weight:700}
.card-primary .value{color:var(--accent)}
.card-secondary .value{color:var(--fg)}
.card .unit{font-size:10px;font-weight:400;color:var(--muted)}
.btn-row{display:flex;gap:8px}
.btn{flex:1;height:38px;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--ff);transition:all .2s}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-outline{background:var(--bg);border:1px solid var(--border);color:var(--muted)}

/* ---- Budget Preview ---- */
.page-preview{display:none;flex-direction:column;flex:1;overflow:hidden}
.topbar{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex-shrink:0;position:sticky;top:0;background:var(--bg);z-index:20}
.topbar .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;border-radius:8px;color:var(--fg);font-size:18px;font-family:var(--ff)}
.topbar .back:hover{background:var(--surface)}
.topbar .title{flex:1;text-align:center;font-size:14px;font-weight:600}
.preview-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 14px 80px}
.scroll-content{display:flex;flex-direction:column;gap:14px}

/* Pie */
.pie-section{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:20px 16px 14px}
.pie-section .sec-title{font-size:12px;font-weight:600;color:var(--fg);text-align:center;margin-bottom:10px}
.pie-wrap{display:flex;justify-content:center;position:relative;touch-action:none}
.pie-wrap svg{width:200px;height:200px;display:block}
.pie-hint{text-align:center;font-size:10px;color:var(--muted);margin-top:6px;min-height:0}
.pie-hint.dim{opacity:0;transition:opacity .3s}

/* Pie legend below chart */
.pie-legend{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;margin-top:12px;padding:0 4px}
.pie-legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--fg-soft);padding:3px 8px;border-radius:var(--r-sm);background:var(--surface);transition:background .2s}
.pie-legend-item.active{background:color-mix(in srgb, var(--accent) 10%, var(--surface))}
.pie-legend-item .ld{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pie-legend-item .ln{font-weight:500;color:var(--fg)}
.pie-legend-item .lv{color:var(--accent);font-weight:600;margin-left:2px}

/* Drag indicator */
.drag-indicator{display:none;position:fixed;pointer-events:none;z-index:100;
  background:rgba(0,0,0,.75);color:#fff;padding:4px 10px;border-radius:6px;
  font-size:11px;font-weight:600;white-space:nowrap;transform:translate(-50%,-100%);
  margin-top:-12px;font-family:var(--ff);letter-spacing:.3px}

/* KPI */
.kpi-section{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:16px}
.kpi-section .sec-title{font-size:12px;font-weight:600;margin-bottom:12px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kpi-item{background:var(--surface);border-radius:var(--r-sm);padding:10px 8px;text-align:center}
.kpi-item .kpi-num{font-size:15px;font-weight:700;color:var(--fg);margin-bottom:2px;transition:color .3s}
.kpi-item .kpi-changed{color:var(--accent)}
.kpi-item .kpi-label{font-size:10px;color:var(--muted)}

/* Milestones - with time + budget + content */
.ms-section{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:16px}
.ms-section .sec-title{font-size:12px;font-weight:600;margin-bottom:14px}
.ms-list{display:flex;flex-direction:column;gap:10px}
.ms-card{border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border)}
.ms-card .ms-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-size:11px}
.ms-card .ms-head .stage{font-weight:600;display:flex;align-items:center;gap:5px}
.ms-card .ms-head .stage .icon{font-size:14px}
.ms-card .ms-head .meta{display:flex;align-items:center;gap:10px;font-size:10px}
.ms-card .ms-head .meta .tag{padding:1px 6px;border-radius:4px;font-weight:500}
.ms-card .ms-head .meta .amt{font-weight:700}
.ms-card .ms-body{padding:8px 12px 10px;font-size:10px;color:var(--fg-soft);line-height:1.5;background:var(--surface)}

/* Bottom bar */
.bottom-bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px;flex-shrink:0;display:flex;gap:8px;align-items:center}
.bottom-bar input{flex:1;height:36px;border:1px solid var(--border);border-radius:var(--r-sm);padding:0 10px;font-size:12px;font-family:var(--ff);outline:none;background:var(--surface)}
.bottom-bar input:focus{border-color:var(--accent)}
.bottom-bar .send-btn{width:36px;height:36px;border:none;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--ff)}
.bottom-bar .send-btn:active{transform:scale(0.95)}
</style>
</head>
<body>
<div class="phone" id="app">
  <div class="notch"></div>
  <div class="phone-inner">
    <div class="statusbar">
      <span>9:41</span>
      <span class="sb-r">
        <svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="6" width="3" height="4" rx="1" fill="#111"/><rect x="4" y="4" width="3" height="6" rx="1" fill="#111"/><rect x="8" y="2" width="3" height="8" rx="1" fill="#111"/><rect x="12" y="0" width="3" height="10" rx="1" fill="#111"/></svg>
        <svg width="14" height="10" viewBox="0 0 14 10"><path d="M7 9.2 1 3.4a8.5 8.5 0 0 1 12 0L7 9.2Z" fill="#111"/></svg>
        <svg width="22" height="10" viewBox="0 0 22 10"><rect x="0.5" y="0.5" width="18" height="9" rx="2" fill="none" stroke="#111"/><rect x="2" y="2" width="13" height="6" rx="1" fill="#111"/><rect x="19" y="3" width="2" height="4" rx="1" fill="#111"/></svg>
      </span>
    </div>

    <!-- ====== Dialog ====== -->
    <div class="page-dialog" id="pageDialog">
      <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:16px">
        <div style="text-align:center">
          <div style="font-size:14px;color:var(--muted);margin-bottom:4px">生成完成</div>
          <div style="font-size:16px;font-weight:600">方案流水线已到检查点</div>
        </div>
      </div>
      <div class="dialog-mask">
        <div class="dialog-box">
          <div class="dialog-title section">
            <div><span style="font-size:16px">📊</span><span class="title" style="margin-left:4px">预算与 KPI</span></div>
            <div class="sub">确认数据后继续生成，不满意可驳回调整</div>
          </div>
          <div class="cards section">
            <div class="card card-primary">
              <div class="label">总预算</div>
              <div class="value"><span id="totalBudgetDisplay">200</span><span class="unit"> 万元</span></div>
            </div>
            <div class="card card-secondary">
              <div class="label">执行周期</div>
              <div class="value"><span id="periodDisplay">3</span><span class="unit"> 个月</span></div>
            </div>
          </div>
          <div class="btn-row section">
            <button class="btn btn-outline" onclick="showPreview()">预览预算</button>
            <button class="btn btn-primary" onclick="alert('确认继续')">确认继续</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ====== Budget Preview ====== -->
    <div class="page-preview" id="pagePreview">
      <div class="topbar">
        <button class="back" onclick="goBack()">‹</button>
        <span class="title">预算分配与预览</span>
        <div style="width:32px"></div>
      </div>
      <div class="preview-scroll" id="scrollArea">
        <div class="scroll-content">
          <!-- 1. Pie + Legend -->
          <div class="pie-section">
            <div class="sec-title">预算占比分布</div>
            <div class="pie-wrap" id="pieWrap">
              <svg viewBox="0 0 240 240" id="pieSvg" style="width:200px;height:200px"></svg>
            </div>
            <div class="pie-legend" id="pieLegend"></div>
            <div class="pie-hint" id="pieHint">↕ 拖拽扇区调整比例</div>
          </div>

          <!-- 2. KPI -->
          <div class="kpi-section">
            <div class="sec-title">核心指标</div>
            <div class="kpi-grid">
              <div class="kpi-item"><div class="kpi-num" id="kpiExpo">—</div><div class="kpi-label">曝光量</div></div>
              <div class="kpi-item"><div class="kpi-num" id="kpiClick">—</div><div class="kpi-label">点击量</div></div>
              <div class="kpi-item"><div class="kpi-num" id="kpiConv">—</div><div class="kpi-label">转化量</div></div>
              <div class="kpi-item"><div class="kpi-num" id="kpiInteract">—</div><div class="kpi-label">互动量</div></div>
            </div>
          </div>

          <!-- 3. Milestones -->
          <div class="ms-section">
            <div class="sec-title">关键里程碑</div>
            <div class="ms-list" id="msList"></div>
          </div>
        </div>
      </div>
      <div class="bottom-bar">
        <input type="text" placeholder="输入备注或反馈…" id="feedbackInput" />
        <button class="send-btn" onclick="sendFeedback()">↵</button>
      </div>
    </div>

    <!-- Drag tooltip -->
    <div class="drag-indicator" id="dragIndicator"></div>
  </div>
</div>

<script>
const COLORS = ['#1677ff','#52c41a','#fa8c16','#eb2f96','#722ed1']
const COLORS_BG = [
  'color-mix(in srgb, #1677ff 20%, #fff)',
  'color-mix(in srgb, #52c41a 20%, #fff)',
  'color-mix(in srgb, #fa8c16 20%, #fff)',
  'color-mix(in srgb, #eb2f96 20%, #fff)',
  'color-mix(in srgb, #722ed1 20%, #fff)',
]

let totalBudget = 200
let period = 3
let allocations = [
  { cat: '达人合作', pct: 25, amount: 50 },
  { cat: '内容制作', pct: 20, amount: 40 },
  { cat: '活动执行', pct: 30, amount: 60 },
  { cat: '平台投放', pct: 15, amount: 30 },
  { cat: '运营资源', pct: 10, amount: 20 },
]

// 里程碑数据：时间 + 预算权重 + 内容
const milestones = [
  { stage: '预热期', icon: '📢', time: '第1个月', desc: '完成头部达人签约和创意素材拍摄', weight: 0.2 },
  { stage: '爆发期', icon: '🚀', time: '第2个月', desc: '全平台密集投放与线下活动引爆', weight: 0.5 },
  { stage: '收尾期', icon: '📊', time: '第3个月', desc: '数据复盘、传播热度延续与案例沉淀', weight: 0.3 },
]

const kpiBase = { expo: 12000000, click: 800000, conv: 50000, interact: 600000 }

/* ───── Pie Drag Interaction ───── */
let dragIdx = -1
let dragStartAngle = 0
let dragOrigPct = 0
let isDragging = false
let hoverIdx = -1

function getAngle(cx, cy, x, y) { return Math.atan2(y - cy, x - cx) }

function getSegAtAngle(angle) {
  let cur = -Math.PI / 2
  for (let i = 0; i < allocations.length; i++) {
    const a = (allocations[i].pct / 100) * 2 * Math.PI
    const end = cur + a
    let a1 = ((cur % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)
    let a2 = ((end % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)
    let ang = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)
    if (a2 < a1) { if (ang >= a1 || ang < a2) return i }
    else { if (ang >= a1 && ang < a2) return i }
    cur = end
  }
  return 0
}

function getSvgPoint(e) {
  const rect = document.getElementById('pieSvg').getBoundingClientRect()
  const cx = rect.left + rect.width / 2
  const cy = rect.top + rect.height / 2
  return { cx, cy, x: e.clientX, y: e.clientY, dist: Math.sqrt((e.clientX - cx) ** 2 + (e.clientY - cy) ** 2), angle: getAngle(cx, cy, e.clientX, e.clientY), rect }
}

function handlePointerDown(e) {
  const p = getSvgPoint(e)
  if (p.dist > p.rect.width * 0.55 || p.dist < p.rect.width * 0.08) return
  dragIdx = getSegAtAngle(p.angle)
  dragStartAngle = p.angle
  dragOrigPct = allocations[dragIdx].pct
  isDragging = true
  updateLegend()
  drawPie()
  e.preventDefault()
}

function handlePointerMove(e) {
  const p = getSvgPoint(e)
  if (isDragging) {
    let delta = p.angle - dragStartAngle
    if (delta > Math.PI) delta -= 2 * Math.PI
    if (delta < -Math.PI) delta += 2 * Math.PI
    let newPct = dragOrigPct + (delta / (2 * Math.PI)) * 80
    newPct = Math.max(3, Math.min(newPct, 85))
    const diff = newPct - allocations[dragIdx].pct
    allocations[dragIdx].pct = newPct
    const others = allocations.filter((_, i) => i !== dragIdx)
    const otherTotal = others.reduce((s, a) => s + a.pct, 0)
    if (otherTotal > 0) {
      others.forEach(a => { a.pct = Math.max(1, a.pct - diff * (a.pct / otherTotal)) })
    }
    const sum = allocations.reduce((s, a) => s + a.pct, 0)
    allocations.forEach(a => { a.pct = (a.pct / sum) * 100; a.amount = Math.round(totalBudget * a.pct / 100) })
    // Show drag tooltip
    const ind = document.getElementById('dragIndicator')
    ind.textContent = `${allocations[dragIdx].cat} ${Math.round(allocations[dragIdx].pct)}%`
    ind.style.display = 'block'
    ind.style.left = p.x + 'px'
    ind.style.top = p.y + 'px'
    syncAll()
    e.preventDefault()
  } else {
    // hover
    if (p.dist <= p.rect.width * 0.55 && p.dist >= p.rect.width * 0.08) {
      const h = getSegAtAngle(p.angle)
      if (h !== hoverIdx) { hoverIdx = h; drawPie(); updateLegend() }
    } else {
      if (hoverIdx !== -1) { hoverIdx = -1; drawPie(); updateLegend() }
    }
  }
}

function handlePointerUp() {
  if (!isDragging) return
  isDragging = false
  document.getElementById('dragIndicator').style.display = 'none'
  document.getElementById('pieHint').classList.add('dim')
  setTimeout(() => { document.getElementById('pieHint').classList.remove('dim') }, 3000)
  drawPie()
  updateLegend()
  hoverIdx = -1
}

// mouse
document.getElementById('pieWrap').addEventListener('mousedown', handlePointerDown)
document.addEventListener('mousemove', handlePointerMove)
document.addEventListener('mouseup', handlePointerUp)
document.getElementById('pieWrap').addEventListener('mouseleave', () => { if (!isDragging) { hoverIdx = -1; drawPie(); updateLegend() } })
// touch
document.getElementById('pieWrap').addEventListener('touchstart', e => { const t = e.touches[0]; handlePointerDown({ clientX: t.clientX, clientY: t.clientY, preventDefault: () => e.preventDefault() }) })
document.addEventListener('touchmove', e => { if (!isDragging) return; const t = e.touches[0]; handlePointerMove({ clientX: t.clientX, clientY: t.clientY, preventDefault: () => e.preventDefault() }) })
document.addEventListener('touchend', handlePointerUp)

/* ───── Draw Pie ───── */
function drawPie() {
  const svg = document.getElementById('pieSvg')
  const cx = 120, cy = 120, r = 92
  let html = ''
  let cur = -Math.PI / 2
  allocations.forEach((a, i) => {
    const angle = (a.pct / 100) * 2 * Math.PI
    const start = cur, end = cur + angle
    const large = angle > Math.PI ? 1 : 0
    const isHov = i === hoverIdx || (isDragging && i === dragIdx)
    const dr = isHov ? r + 6 : r
    const d = `M ${cx + dr * Math.cos(start)} ${cy + dr * Math.sin(start)} A ${dr} ${dr} 0 ${large} 1 ${cx + dr * Math.cos(end)} ${cy + dr * Math.sin(end)} L ${cx} ${cy} Z`
    html += `<path d="${d}" fill="${COLORS[i]}" stroke="#fff" stroke-width="${isHov ? 3 : 2}" opacity="${isHov ? 1 : 0.9}" style="transition:opacity .1s"/>`
    // Label
    const mid = start + angle / 2
    const lr = r + 18
    const lx = cx + lr * Math.cos(mid), ly = cy + lr * Math.sin(mid)
    if (a.pct > 4) {
      html += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="${COLORS[i]}" style="pointer-events:none">${Math.round(a.pct)}%</text>`
    }
    cur = end
  })
  // center
  html += `<circle cx="${cx}" cy="${cy}" r="30" fill="#fff" stroke="#eee" stroke-width="1"/>`
  html += `<text x="${cx}" y="${cy - 5}" text-anchor="middle" font-size="10" fill="var(--muted)" style="pointer-events:none">总计</text>`
  html += `<text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--fg)" style="pointer-events:none">${totalBudget}万</text>`
  svg.innerHTML = html
}

/* ───── Legend ───── */
function updateLegend() {
  const el = document.getElementById('pieLegend')
  el.innerHTML = allocations.map((a, i) => {
    const active = i === hoverIdx || (isDragging && i === dragIdx)
    return `<div class="pie-legend-item${active ? ' active' : ''}">
      <span class="ld" style="background:${COLORS[i]}"></span>
      <span class="ln">${a.cat}</span>
      <span class="lv">${Math.round(a.pct)}%</span>
      <span style="color:var(--fg);font-weight:600">${a.amount}万</span>
    </div>`
  }).join('')
}

/* ───── KPI ───── */
function calcKPI() {
  const f = name => (allocations.find(x => x.cat === name)?.pct || 0)
  const daren = f('达人合作'), neirong = f('内容制作'), huodong = f('活动执行'), pingtai = f('平台投放'), yunying = f('运营资源')
  return {
    expo: Math.round(kpiBase.expo * (0.2 + 0.6 * (pingtai / 20) + 0.2 * (huodong / 30))),
    click: Math.round(kpiBase.click * (0.3 + 0.5 * (pingtai / 20) + 0.2 * (neirong / 20))),
    conv: Math.round(kpiBase.conv * (0.2 + 0.5 * (neirong / 20) + 0.15 * (huodong / 30) + 0.15 * (yunying / 10))),
    interact: Math.round(kpiBase.interact * (0.3 + 0.5 * (daren / 25) + 0.2 * (huodong / 30)))
  }
}

function formatNum(n) {
  if (n >= 10000) return (n / 10000).toFixed(n % 10000 === 0 ? 0 : 1) + '万'
  return n.toLocaleString()
}

function renderKPI() {
  const k = calcKPI()
  document.getElementById('kpiExpo').textContent = formatNum(k.expo)
  document.getElementById('kpiClick').textContent = formatNum(k.click)
  document.getElementById('kpiConv').textContent = formatNum(k.conv)
  document.getElementById('kpiInteract').textContent = formatNum(k.interact)
}

/* ───── Milestones ───── */
function calcMilestoneBudget() {
  // 基于分配比例推算各阶段预算
  const f = name => (allocations.find(x => x.cat === name)?.pct || 0) / 100
  const daren = f('达人合作'), neirong = f('内容制作'), huodong = f('活动执行'), pingtai = f('平台投放'), yunying = f('运营资源')
  // 预热期：内容制作 ×0.6 + 达人 ×0.2
  const warmRatio = neirong * 0.6 + daren * 0.2 + 0.08
  // 爆发期：活动 ×0.7 + 平台 ×0.6 + 达人 ×0.5
  const peakRatio = huodong * 0.7 + pingtai * 0.6 + daren * 0.5 + 0.08
  // 收尾期：运营 ×0.8 + 剩余
  const endRatio = yunying * 0.8 + 0.08
  const sum = warmRatio + peakRatio + endRatio
  return [
    Math.round(totalBudget * warmRatio / sum),
    Math.round(totalBudget * peakRatio / sum),
    totalBudget - Math.round(totalBudget * warmRatio / sum) - Math.round(totalBudget * peakRatio / sum)
  ]
}

function renderMilestones() {
  const budgets = calcMilestoneBudget()
  const msColors = ['#1677ff', '#52c41a', '#fa8c16']
  const msBgs = ['color-mix(in srgb, #1677ff 8%, #fff)', 'color-mix(in srgb, #52c41a 8%, #fff)', 'color-mix(in srgb, #fa8c16 8%, #fff)']
  const tagBgs = ['color-mix(in srgb, #1677ff 15%, #fff)', 'color-mix(in srgb, #52c41a 15%, #fff)', 'color-mix(in srgb, #fa8c16 15%, #fff)']
  document.getElementById('msList').innerHTML = milestones.map((m, i) =>
    `<div class="ms-card" style="border-color:${msColors[i]}">
      <div class="ms-head" style="background:${msBgs[i]}">
        <span class="stage"><span class="icon">${m.icon}</span>${m.stage}</span>
        <span class="meta">
          <span class="tag" style="background:${tagBgs[i]};color:${msColors[i]}">${m.time}</span>
          <span class="amt" style="color:${msColors[i]}">${budgets[i]}万元</span>
        </span>
      </div>
      <div class="ms-body">${m.desc}</div>
    </div>`
  ).join('')
}

/* ───── Sync ───── */
function syncAll() {
  drawPie()
  updateLegend()
  renderKPI()
  renderMilestones()
}

/* ───── Pages ───── */
function showPreview() {
  document.getElementById('pageDialog').style.display = 'none'
  document.getElementById('pagePreview').style.display = 'flex'
  allocations.forEach(a => { a.amount = Math.round(totalBudget * a.pct / 100) })
  syncAll()
}

function goBack() {
  // 将调整后的预算数据提交后端
  const data = allocations.map(a => ({ category: a.cat, percentage: Math.round(a.pct * 10) / 10, amount: a.amount }))
  console.log('[BudgetPreview] 返回数据:', data)
  document.getElementById('pagePreview').style.display = 'none'
  document.getElementById('pageDialog').style.display = 'flex'
}

function sendFeedback() {
  const input = document.getElementById('feedbackInput')
  const val = input.value.trim()
  if (!val) return alert('请输入备注或反馈')
  alert('反馈已发送：' + val)
  input.value = ''
}

// Init
document.getElementById('totalBudgetDisplay').textContent = totalBudget
document.getElementById('periodDisplay').textContent = period
syncAll()
</script>
